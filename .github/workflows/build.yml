name: Build ImmortalWrt

on:
  push:
    branches: main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget
          [ ! -e /usr/bin/python ] && ln -s /usr/bin/python3 /usr/bin/python

      - name: Clone ImmortalWrt source
        run: |
          git clone https://mirror.ghproxy.com/https://github.com/immortalwrt/immortalwrt.git ./openwrt
          cd openwrt
          cp -rf ../diy.sh ./
          cp -rf ../.config ./
          cp -rf ../files ./
          chmod +x ./diy.sh

      - name: Build firmware
        run: |
          cd openwrt
          ./diy.sh
          export DOWNLOAD_MIRROR=china
          make defconfig
          make download -j2
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          path: openwrt/bin/targets/ramips/mt7621/immortalwrt
          name: Firmware
