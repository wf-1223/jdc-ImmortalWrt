name: Build ImmortalWrt

on:
  push:
    branches: main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          set +e
          sudo apt update
          sudo apt remove -y needrestart || true
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget
          [ ! -e /usr/bin/python ] && ln -s /usr/bin/python3 /usr/bin/python
          set -e

      - name: Clone ImmortalWrt source
        run: |
          git clone https://github.com/immortalwrt/immortalwrt.git ./openwrt
          cd openwrt
          cp -rf ../diy.sh ./
          cp -rf ../.config ./
          cp -rf ../files ./
          chmod +x ./diy.sh

      - name: Build firmware
        run: |
          cd openwrt
          ./diy.sh
          export DOWNLOAD_MIRROR=china
          make defconfig
          make download -j2
          make -j$(nproc)

      # ========== 下面这段是修改后的上传代码 ==========
      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          path: openwrt/bin/targets/ramips/mt7621/*.bin
          name: JDCloud_RE-SP-01B_Firmware
